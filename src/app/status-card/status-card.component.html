<div class="card-container">
  <div
    class="status-card active-card"
    [class.selected]="selectedStatus === 'Active'"
    (click)="selectStatus('Active')"
  >
    <h3>Active</h3>
    <p>{{ activeCount }}</p>
  </div>

  <div
    class="status-card inactive-card"
    [class.selected]="selectedStatus === 'Inactive'"
    (click)="selectStatus('Inactive')"
  >
    <h3>Inactive</h3>
    <p>{{ inactiveCount }}</p>
  </div>

  <div
    class="status-card pending-card"
    [class.selected]="selectedStatus === 'Pending'"
    (click)="selectStatus('Pending')"
  >
    <h3>Pending</h3>
    <p>{{ pendingCount }}</p>
  </div>

  <div
    class="status-card all-card"
    [class.selected]="selectedStatus === 'All'"
    (click)="selectStatus('All')"
  >
    <h3>All</h3>
    <p>{{ activeCount + inactiveCount + pendingCount }}</p>
  </div>
</div>
